<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="container mt-5">

    <div class="text-center mb-4">

        <h1>✏️ Edit Student</h1>

        <p class="text-muted">
            Update student information
        </p>

    </div>


    <div class="card shadow">

        <div class="card-header">

            <h4 class="mb-0">
                Student Information
            </h4>

        </div>


        <div class="card-body">

            <form
                action="{{ url_for('edit_student', id=student.id) }}"
                method="POST">


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ student.name }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ student.email }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ student.phone }}">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Course
                        </label>

                        <input
                            type="text"
                            name="course"
                            class="form-control"
                            value="{{ student.course }}"
                            required>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Marks
                        </label>

                        <input
                            type="number"
                            name="marks"
                            class="form-control"
                            value="{{ student.marks }}"
                            min="0"
                            max="100"
                            step="0.01"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-success">
                    💾 Update Student
                </button>


                <a
                    href="{{ url_for('home') }}"
                    class="btn btn-secondary">
                    Cancel
                </a>


            </form>

        </div>

    </div>

</div>

</body>

</html>
